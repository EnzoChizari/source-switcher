<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DX5 Helium tab link</title><link rel="stylesheet" href="style.css"></head>
<body><h1>Source Switcher for Helium</h1><p>Link a tab to Source Switcher.</p>
<div class="actions"><button id="follow">Follow this tab</button><button id="stop">Stop following</button></div>
<p><label><input id="auto-follow" type="checkbox"> Automatically follow the active tab</label></p>
<p id="status" role="status">Reading connection state…</p>
<p class="detail">Reads supported file and stream headers. Follow before starting playback when possible. Other media uses Windows application-stream detection when available.</p>
<button id="fixtures">Open PCM playback demo</button><script src="popup.js"></script></body></html>
